# Cloudflare Workers 配置 — 点数计费 API
# 文档见 worker/README.md

name = "poi-billing-api"
main = "src/index.js"
compatibility_date = "2026-08-25"
workers_dev = true
preview_urls = false

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "poi-billing"
database_id = "1507a498-61c6-4db5-887b-20f790d79ee7"

# AUTH_SECRET / ADMIN_KEY / GRSAI_API_KEY 不写入仓库，全部使用 Secrets：
#   npx wrangler secret put AUTH_SECRET
#   npx wrangler secret put ADMIN_KEY
#   npx wrangler secret put GRSAI_API_KEY
[vars]
ALLOW_ORIGIN = "https://tools.sjcstone.cn"
